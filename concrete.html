<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suraj Barthy</title>
<script>try{var t=localStorage.getItem("sb-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}document.documentElement.lang="en";document.documentElement.classList.add("concrete");</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
/* Runner and doors. One scene, two cameras.
   2D: a long-lens side view of a wall. Each work item is a numbered line; the runner crosses them.
   3D: the same wall seen from a low 3/4 angle. The lines unfold into doors; the runner keeps his
   place at the left of frame and the doors come to him. Toggling only moves the camera. */
:root{
  --paper:#FFFFFF;
  --wall:#F4F3EF;
  --floor:#E8E6E0;
  --ink:#111111;
  --ink-2:#4F4F4C;
  --ink-3:#64635E;
  --ink-far:#A9A8A2;
  --rule:#E3E2DD;
  --well:#EFEFEE;
  --leaf:#E4E2DB;
  --reveal:#CFCCC3;
  --lamp:#FFF4DA;
  --lamp-core:#FFFFFF;
  --dot:rgba(17,17,17,.07);
  --device:#1D1D1F;
  --device-edge:#3A3A3C;
  --screen:#0B0B0C;
  --tbd-bg:#FFF3C4;
  --tbd-ink:#5C4A00;
  --note-bg:#F1F5FF;
  --note-ink:#24346B;
  --jones-green:#DCE7C9;
  --jones-green-ink:#24331A;
  --limit:#C2410C;
  --sans:Onest,"Helvetica Neue",Arial,system-ui,sans-serif;
  --serif:var(--sans);
  --e:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#121211;--wall:#1A1A18;--floor:#111110;--ink:#EDEBE6;--ink-2:#B3B1AB;--ink-3:#8F8D87;--ink-far:#5B5954;
    --rule:#2C2B28;--well:#222220;--leaf:#262522;--reveal:#33312D;--lamp:#F2DDAF;--lamp-core:#FFF4DC;--dot:rgba(237,235,230,.08);
    --tbd-bg:#4A3D0A;--tbd-ink:#FFE9A3;--note-bg:#1B2340;--note-ink:#C9D5FF;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121211;--wall:#1A1A18;--floor:#111110;--ink:#EDEBE6;--ink-2:#B3B1AB;--ink-3:#8F8D87;--ink-far:#5B5954;
  --rule:#2C2B28;--well:#222220;--leaf:#262522;--reveal:#33312D;--lamp:#F2DDAF;--lamp-core:#FFF4DC;--dot:rgba(237,235,230,.08);
  --tbd-bg:#4A3D0A;--tbd-ink:#FFE9A3;--note-bg:#1B2340;--note-ink:#C9D5FF;color-scheme:dark;
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.in-scene{background:var(--floor)}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 40px;max-width:1440px;margin:0 auto;box-sizing:border-box}
@media (min-width:900px){.wrap{padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(64px,env(safe-area-inset-right,0px))}}

/* ---------- Scene ---------- */
#track{position:relative}
#stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--floor);user-select:none;-webkit-user-select:none}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0 0;transform-style:preserve-3d}
#world *{transform-style:preserve-3d}
.seg{position:absolute;top:-1800px;height:1800px;background-color:var(--wall);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:24px 24px;backface-visibility:hidden}
.ground{position:absolute;top:-1px;height:2px;background:var(--ink);transform:translateZ(1px)}

.it{position:absolute;left:0;top:0}
.post{position:absolute;left:-1px;width:2px;background:var(--ink);transform-origin:50% 100%;transform:translateZ(1px)}
.post.dash{background:repeating-linear-gradient(to bottom,var(--ink) 0 7px,transparent 7px 13px)}
.hit{position:absolute;left:-14px;width:28px;cursor:pointer;background:transparent;border:0;padding:0}
.pn{position:absolute;left:0;font-size:12px;line-height:1;color:var(--ink-3);font-variant-numeric:tabular-nums;transform:translate(-50%,-22px);white-space:nowrap;transition:color .3s}
.it.on .pn{color:var(--ink)}

/* the door: a real opening in the wall with a lit room behind it. Invisible in 2D (a patch of wall
   covers the hole), it unfolds as the camera swings round. */
.door{position:absolute;left:0;cursor:pointer}
.door .box{position:absolute;inset:0}
.door .back{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 65%,var(--lamp-core),var(--lamp) 55%,var(--reveal));transform:translateZ(-72px)}
.door .rv{position:absolute;background:var(--reveal)}
.door .rv.l{left:0;top:0;bottom:0;width:72px;transform-origin:0 50%;transform:rotateY(90deg);background:linear-gradient(to right,var(--reveal),var(--lamp))}
.door .rv.r{right:0;top:0;bottom:0;width:72px;transform-origin:100% 50%;transform:rotateY(-90deg);background:linear-gradient(to left,var(--reveal),var(--lamp))}
.door .rv.t{left:0;right:0;top:0;height:72px;transform-origin:50% 0;transform:rotateX(-90deg);background:linear-gradient(to bottom,var(--reveal),var(--lamp))}
.door .rv.b{left:0;right:0;bottom:0;height:72px;transform-origin:50% 100%;transform:rotateX(90deg);background:linear-gradient(to top,var(--leaf),var(--lamp-core))}
.door .leaf{position:absolute;inset:0;background:var(--leaf);transform-origin:0 50%;transform:translateZ(-9px) rotateY(9deg);transition:transform .8s cubic-bezier(.3,.7,.2,1);box-shadow:inset 0 0 0 1px var(--reveal)}
.door .leaf::after{content:"";position:absolute;right:11%;top:53%;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.door .leaf::before{content:"";position:absolute;inset:11px 11px auto 11px;height:40%;border:1px solid var(--reveal)}
.door .patch{position:absolute;inset:-1px -1px 0 -1px;background-color:var(--wall);background-image:radial-gradient(var(--dot) 1px,transparent 1.4px);background-size:24px 24px}
.door .jt{position:absolute;left:0;top:-2px;height:2px;width:calc(100% + 1px);background:var(--ink);transform-origin:0 50%;transform:translateZ(1px) scaleX(0)}
.door .jr{position:absolute;right:-2px;top:-2px;bottom:0;width:2px;background:var(--ink);transform-origin:50% 0;transform:translateZ(1px) scaleY(0)}
.door.dash .jt{background:repeating-linear-gradient(to right,var(--ink) 0 7px,transparent 7px 13px)}
.door.dash .jr{background:repeating-linear-gradient(to bottom,var(--ink) 0 7px,transparent 7px 13px)}
.door.dash .leaf{display:none}
.door.dash .back{background:var(--wall)}
@media (hover:hover){.it.k-full .door:hover .leaf,.it.k-short .door:hover .leaf{transform:translateZ(-9px) rotateY(38deg)}}
.it.opening .leaf{transform:translateZ(-9px) rotateY(100deg)!important;transition-duration:1s}

.lab{position:absolute;width:300px;transform:translateZ(3px)}
#world .lab,#world .lab *,#world .wallText,#world .wallText *,#world .hang,#world .hang *{transform-style:flat}
.hang{position:absolute;transform:translateZ(3px);transform-origin:0 100%}
.art{cursor:pointer;background:var(--device);box-sizing:border-box}
.art .scr{position:relative;width:100%;height:100%;overflow:hidden;background:var(--well)}
.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.art .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:11px;line-height:1.35;color:var(--ink-2)}
.art.phone{width:100px;height:216px;padding:4px;border-radius:16px}
.art.phone .scr{border-radius:12px}
.art.laptop{width:220px;height:142px;padding:6px 6px 9px;border-radius:7px 7px 3px 3px}
.art.tile{width:130px;height:130px;padding:0;background:none}
.art.obj{width:180px;height:135px;padding:0;background:none}
.door .back.img{background-size:62% auto,cover;background-position:50% 40%,center;background-repeat:no-repeat}
.lab .m{display:flex;flex-wrap:wrap;gap:0 .45em;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin:0 0 6px}
.lab h2{margin:0 0 6px;font-size:23px;line-height:1.12;font-weight:400;letter-spacing:-.02em}
.lab h2 a{text-decoration:none}
.lab p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.lab .acts{display:flex;gap:16px;margin-top:10px;font-size:14px;flex-wrap:wrap}
.it.k-line .lab{width:340px}
.it.k-line .lab h2{font-size:18px}
.it.k-line .lab p{font-size:13px}

.wallText{position:absolute;transform:translateZ(3px)}
.intro{width:560px}
.intro .name{margin:0 0 18px;font-size:15px;font-weight:500;line-height:1.5}
.intro .note{max-width:440px}
.intro .side.dim{margin-top:2px;color:var(--ink-3)}
.foot-n{margin:18px 0 0}
.foot-n button{background:none;border:0;padding:0;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:24px}
.intro .state{margin:0;font-size:34px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.intro .state.dim{color:var(--ink-3);margin-bottom:22px}
.intro .side{margin:0;font-size:15px;color:var(--ink-2);max-width:440px}
.endw{width:420px}
.endw .state{margin:0 0 18px;font-size:34px;line-height:1.15;letter-spacing:-.02em}
.endw .links{display:flex;gap:20px;flex-wrap:wrap;font-size:16px}

#runner{position:absolute;inset:0;pointer-events:none}
.hint{position:absolute;font-size:13px;color:var(--ink-2);pointer-events:none;transition:opacity .5s;white-space:nowrap}

/* fixed chrome */
.links{display:flex;gap:20px;flex-wrap:wrap;font-size:15px;margin:0}
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px max(16px,env(safe-area-inset-left,0px)) 0;pointer-events:none}
.top>*{pointer-events:auto}
.top .who{white-space:nowrap;font-size:15px;font-weight:500;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;min-height:36px}
.top nav{display:flex;align-items:center;gap:18px;font-size:14px}
.top nav a{text-decoration:none}
.switch{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px;background:var(--wall)}
.switch button{border:0;background:none;padding:5px 13px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--ink-2);min-height:30px;font-variant-numeric:tabular-nums}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.map{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:20;height:34px}
.map .ln{position:absolute;left:0;right:0;top:22px;height:1px;background:var(--ink-3)}
.map button{position:absolute;top:0;transform:translateX(-50%);background:none;border:0;padding:0 2px;height:34px;font-size:11px;color:var(--ink-3);cursor:pointer;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.map button::after{content:"";width:1px;height:9px;background:currentColor}
.map button.on,.map button:hover{color:var(--ink)}
.map button::before{content:attr(data-t);position:absolute;bottom:40px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--ink);background:var(--wall);padding:3px 8px;border-radius:4px;box-shadow:0 0 0 1px var(--rule);opacity:0;pointer-events:none;transition:opacity .15s}
.map button:hover::before,.map button:focus-visible::before{opacity:1}
.map button{min-width:24px}
.map .me{position:absolute;top:19px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--ink)}
body:not(.in-scene) .top,body:not(.in-scene) .map{display:none}
@media (max-width:640px){
  .intro{width:300px}
  .intro .state,.endw .state{font-size:26px}
  .endw{width:300px}
  .top nav{gap:10px;font-size:13px}
  .top .who{font-size:14px}
  .switch button{padding:4px 9px;min-height:28px}
  .map button{font-size:0;gap:0;justify-content:flex-end;padding-bottom:7px}
}

#curtain{position:fixed;inset:0;z-index:40;background:var(--paper);pointer-events:none;opacity:0}
#app:empty{display:none}

/* ---------- Story pages (from V0) ---------- */
#runner3d{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .6s cubic-bezier(.2,.8,.2,1)}
#runner3d.on{opacity:1}

/* ===== The building section: a brick wall and a boarded floor, drawn as tiny SVG tiles (no image requests). ===== */

html .seg.brk,html .door .patch.brk{background-image:var(--brick);background-size:240px 88px}
.bfloor{position:absolute;top:0;height:640px;transform-origin:0 0;transform:rotateX(90deg);background:var(--boards) 0 0/480px 120px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 0,#000 60%,transparent)}
.ser{font-family:var(--serif);font-style:italic;font-weight:400}
.tbd{background:var(--tbd-bg);color:var(--tbd-ink);border-radius:3px;padding:0 .3em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.note{display:none;background:var(--note-bg);color:var(--note-ink);font-size:13px;line-height:1.45;padding:10px 12px;border-radius:6px;margin:12px 0;max-width:640px}
.note b{font-weight:500}
body.notes .note{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- Devices ---------- */
.phone{container-type:inline-size;max-width:100%;position:relative}
.pb{aspect-ratio:9/19.5;background:var(--device);border-radius:15cqi;padding:3.4cqi;box-sizing:border-box;position:relative;box-shadow:inset 0 0 0 .6cqi var(--device-edge),0 44px 70px -30px rgba(17,17,17,.42),0 12px 24px -12px rgba(17,17,17,.28)}
.phone .scr{border-radius:11.6cqi}
.isl{position:absolute;top:5.6cqi;left:50%;width:26cqi;height:7.4cqi;margin-left:-13cqi;background:var(--screen);border-radius:8cqi;z-index:2}
.scr{width:100%;height:100%;overflow:hidden;background:var(--screen);position:relative}
.scr img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.lap{container-type:inline-size;max-width:100%}
.lid{aspect-ratio:16/10.4;background:var(--device);border-radius:3cqi 3cqi .8cqi .8cqi;padding:2.2cqi 2.2cqi 3cqi;box-sizing:border-box;box-shadow:inset 0 0 0 .25cqi var(--device-edge),0 44px 70px -40px rgba(17,17,17,.42)}
.lid .scr{border-radius:.5cqi}
.base{height:2.4cqi;width:112%;margin-left:-6%;background:#D6D6D8;border-radius:.3cqi .3cqi 2.4cqi 2.4cqi}
.win{container-type:inline-size;border-radius:10px;background:#F4F4F4;box-shadow:0 0 0 1px rgba(17,17,17,.08),0 30px 50px -30px rgba(17,17,17,.35);overflow:hidden;max-width:100%}
.bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;background:#E9E9E9;font-size:12px;color:var(--ink-2)}
.bar i{width:9px;height:9px;border-radius:50%;background:#C9C9C9;display:block}
.bar span{margin-left:10px}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:9%;box-sizing:border-box;color:#9A9AA0;font-size:13px;line-height:1.35}
.win .ph,.obj .ph{color:var(--ink-2)}
.scr.empty{background:var(--well)}
.scr.empty .ph,.win .ph,.obj .ph{align-items:center;justify-content:center;text-align:center;color:var(--ink-2)}
.obj{position:relative;background:var(--well);max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1/1;background:var(--well)}
.tile .ph{font-size:12px;padding:10px;color:var(--ink-2)}
.ct{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px}
.ct p{margin:10px 0 0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.ct b{font-weight:500;color:var(--ink)}

/* ---------- After the stream ---------- */
.after{transition:opacity .3s var(--e),transform .5s var(--e)}
.sec{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr);gap:6%;padding-top:88px;margin-top:40px;border-top:1px solid var(--rule)}
.sec>.ser{margin:0;font-size:22px;color:var(--ink-2)}
.big{margin:0 0 28px;font-size:clamp(22px,2vw,26px);line-height:1.4;max-width:640px;text-wrap:pretty}
.prose p{margin:0 0 16px;font-size:18px;line-height:1.55;max-width:640px}
.xp{list-style:none;margin:28px 0 0;padding:0;max-width:640px;border-top:1px solid var(--rule)}
.xp li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px}
.xp span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.xp small{grid-column:1 / -1;color:var(--ink-2);font-size:14px}
.tools{margin:20px 0 0;font-size:14px;color:var(--ink-2);max-width:640px}
.cform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;max-width:720px}
.cform label{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.cform .wide{grid-column:1 / -1}
.cform input,.cform select,.cform textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:0;border-bottom:1px solid var(--ink);padding:8px 0;min-height:44px;border-radius:0;min-width:0}
.cform textarea{resize:vertical}
.btn{justify-self:start;min-height:44px;padding:0 22px;border-radius:22px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-size:15px;cursor:pointer}
.btn:hover{background:var(--paper);color:var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.sent{font-size:15px;color:var(--ink-2);margin:0}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 24px;margin-top:96px;padding-top:20px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-2)}
.foot button{background:none;border:0;padding:0;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:24px}

/* ---------- Story pages ---------- */
.story{animation:rise .7s var(--e) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.snav{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;font-size:15px;margin-bottom:40px}
.snav nav{display:flex;gap:20px;flex-wrap:wrap}
.back{background:none;border:0;padding:0;font-size:15px;cursor:pointer;min-height:44px;color:var(--ink)}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:4%;margin:0 auto 56px;max-width:900px}
.hero .phone{width:min(300px,44%)}
.hero .phone.sm{width:min(260px,38%);transform:translateY(-6%)}
.hero .lap{width:100%}
.hero .win{width:100%}
.head{max-width:760px;margin:0 auto}
.fact{margin:0 0 10px;font-size:21px;color:var(--ink-2)}
.head h1{margin:0 0 16px;font-size:clamp(40px,5vw,60px);line-height:1.02;font-weight:400;letter-spacing:-.03em;text-wrap:balance}
.lede{margin:0;font-size:22px;line-height:1.45;text-wrap:pretty}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:36px 0 0;padding:16px 0 0;border-top:1px solid var(--rule)}
.facts div{min-width:0}
.facts dt{font-size:12px;color:var(--ink-3);margin:0 0 4px}
.facts dd{margin:0;font-size:15px}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.depth{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;display:flex;justify-content:center;margin:44px auto 0}
.depth .switch{margin:0;background:var(--paper);box-shadow:0 6px 20px -10px rgba(17,17,17,.25)}
.depth-hint{text-align:center;font-size:13px;color:var(--ink-3);margin:10px 0 0}
.blk{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:24px 48px;max-width:1000px;margin:0 auto;padding:56px 0 0}
.blk>.ser{margin:0;font-size:22px;color:var(--ink-2);line-height:1.2}
.blk .body{min-width:0;max-width:680px}
.blk .body p{margin:0 0 16px;font-size:18px;line-height:1.6}
.blk .body ul{margin:0 0 16px;padding-left:20px;font-size:17px;line-height:1.55}
.blk .body li{margin-bottom:8px}
.blk .body b{font-weight:500}
@media (max-width:760px){.blk{grid-template-columns:1fr;gap:12px;padding-top:44px}}
.full{display:none}
.is-full .full{display:block}
.is-full .blk.full{display:grid}
.is-full .short-only{display:none}
.quote{margin:8px 0 20px;padding:0;font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.3;max-width:640px}
.quote small{display:block;font-family:var(--sans);font-style:normal;font-size:13px;color:var(--ink-3);margin-top:8px}
.calls{list-style:none;margin:0;padding:0;counter-reset:c}
.calls li{display:grid;grid-template-columns:40px minmax(0,1fr);padding:20px 0;border-top:1px solid var(--rule)}
.calls li:last-child{border-bottom:1px solid var(--rule)}
.calls .n{font-size:13px;color:var(--ink-3);padding-top:6px;font-variant-numeric:tabular-nums}
.calls h3{margin:0;font-size:22px;line-height:1.3;font-weight:400;letter-spacing:-.01em}
.calls .no{display:block;font-size:15px;color:var(--ink-2);margin-top:6px}
.calls .why{display:none;margin-top:14px}
.is-full .calls .why{display:block}
.calls .why p{font-size:17px!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0 0 10px}
.stats div{border-top:1px solid var(--ink);padding-top:10px}
.stats b{display:block;font-size:clamp(32px,4vw,44px);font-weight:400;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--ink-2)}
.src{font-size:13px;color:var(--ink-3);margin:6px 0 0!important}
fig,figure{margin:0}
.fig{max-width:1000px;margin:40px auto 0}
.fig img{display:block;width:100%;height:auto;border-radius:6px;background:var(--well)}
.fig.narrow{max-width:760px}
.fig.dark img{background:#2C2C2C}
.fig figcaption{font-size:14px;color:var(--ink-2);margin-top:10px;max-width:640px}
.fig .ph-box{position:relative;aspect-ratio:16/9;background:var(--well);border-radius:6px}
.fig .ph-box .ph{color:var(--ink-2)}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:640px){.pair,.trio{grid-template-columns:1fr}}
.strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
.strip img{width:180px;flex:0 0 auto;scroll-snap-align:start;border-radius:12px;box-shadow:0 0 0 1px rgba(17,17,17,.08)}
.tbl{overflow-x:auto;margin:0 0 16px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px;line-height:1.45}
.tbl th{text-align:left;font-weight:400;font-size:12px;color:var(--ink-3);padding:0 14px 8px 0;border-bottom:1px solid var(--ink)}
.tbl td{padding:12px 14px 12px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr.won td{font-weight:500}
.next{max-width:1000px;margin:96px auto 0;padding-top:24px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.next a{font-size:clamp(28px,3vw,40px);letter-spacing:-.02em;text-decoration:none}
.next a:hover{color:var(--ink-2)}
.next small{font-size:13px;color:var(--ink-3)}
.lock{border:1px solid var(--rule);border-radius:10px;padding:24px;max-width:560px}
.lock h3{margin:0 0 8px;font-size:20px;font-weight:400}
.lock p{font-size:16px!important;color:var(--ink-2)}
.lock form{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.lock label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);flex:1 1 200px}
.lock input{font:inherit;font-size:16px;border:0;border-bottom:1px solid var(--ink);padding:8px 0;min-height:44px;border-radius:0;background:var(--paper);color:var(--ink)}
.lock .err{font-size:14px;color:var(--limit);margin:8px 0 0;min-height:1.2em}

/* ---------- Try it: Track As You Go ---------- */
.try{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:48px;align-items:center;max-width:1000px;margin:0 auto}
@media (max-width:760px){.try{grid-template-columns:1fr;justify-items:center}}
.try .phone{width:100%;max-width:300px}
.app{position:absolute;inset:0;background:#FBFAF6;display:flex;flex-direction:column;padding:22% 7% 8%;box-sizing:border-box;font-size:12px;color:#1E2418;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.app .kick{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#6D7362}
.app h4{margin:2px 0 14px;font-family:var(--serif);font-size:22px;font-weight:400}
.card{background:#FFFFFF;border-radius:14px;padding:12px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.05)}
.card .t{font-weight:500;font-size:13px}
.card .s{color:#6D7362;font-size:10.5px;margin:2px 0 10px}
.ttiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tt{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
.tt .sq{width:100%;aspect-ratio:1/1;border-radius:12px;background:#F1F1EC;display:flex;align-items:center;justify-content:center;font-size:20px;color:#2A3320;transition:background .2s,transform .12s;font-variant-numeric:tabular-nums}
.tt.has .sq{background:var(--jones-green)}
.tt.over .sq{background:#FFFFFF;color:var(--limit);box-shadow:inset 0 0 0 1.5px var(--limit)}
.tt:active .sq{transform:scale(.94)}
.tt .k{font-size:10.5px;color:#4A5140}
.limit{color:var(--limit);font-size:10.5px;margin:10px 0 0;min-height:1.3em}
.ck{margin-top:12px;background:#FFFFFF;border-radius:14px;padding:12px;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.ck .t{font-weight:500;font-size:13px}
.ck .s{color:#6D7362;font-size:10.5px;margin-top:2px}
.toast{position:absolute;top:13%;left:50%;transform:translate(-50%,-8px);background:var(--jones-green);color:var(--jones-green-ink);font-size:11px;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .18s,transform .18s;white-space:nowrap;pointer-events:none;z-index:3;font-variant-numeric:tabular-nums}
.toast.on{opacity:1;transform:translate(-50%,0)}
.try-copy h3{margin:0 0 10px;font-size:26px;font-weight:400;letter-spacing:-.02em}
.try-copy p{margin:0 0 12px;font-size:17px;line-height:1.55;max-width:460px}
.try-copy .reset{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px;color:var(--ink-2);min-height:32px}

@media (max-width:820px){
  .sec{grid-template-columns:1fr;gap:12px}
  .cform{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles .tile:nth-child(n+4){display:none}
  .ct{grid-template-columns:1fr}
}
/* ---------- Pass 2 (fonts now set below): 16px minimum, theme toggle, door glow ---------- */
.ser{font-family:var(--sans);font-style:normal;font-weight:500}

/* the room glows with a blurred tone of the project, like light through frosted glass */
.door .back{overflow:hidden}
.door .tone{position:absolute;inset:-12%;background-size:cover;background-position:center;filter:blur(6px) saturate(1.15)}

/* header */
.skip{position:fixed;left:16px;top:-80px;z-index:60;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:6px;font-size:16px;text-decoration:none}
.skip:focus{top:12px;color:var(--paper)}
.top .who{font-size:16px}
.top nav{font-size:16px;gap:20px}
.switch button{font-size:16px;padding:5px 14px;min-height:34px}
.theme{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--wall);color:var(--ink);cursor:pointer;padding:0}
.theme:hover{border-color:var(--ink-3)}

.foot-n button{font-size:16px}
.hint{font-size:16px}
.art .ph{font-size:16px;line-height:1.3;padding:8px}
.art.phone{width:110px;height:236px}
.map button{font-size:16px;height:40px;top:-6px}

/* story pages from V0, brought up to 16px */
.note{font-size:16px}
.snav,.back{font-size:16px}

.stats span{font-size:16px}

.ph{font-size:16px}

.ct p{font-size:16px}
.sec>.ser{font-size:20px}

/* index: the conforming list version of the hall */
.ixl{max-width:1000px;margin:48px auto 0;overflow-x:auto}
.ixl table{width:100%;border-collapse:collapse;font-size:16px;min-width:560px}

/* toned rooms: the whole room takes the project's colour, darker toward the opening */
.door.toned .rv.l{background:linear-gradient(to right,rgba(0,0,0,.28),rgba(0,0,0,0) 70%),var(--tone) left center/cover}
.door.toned .rv.r{background:linear-gradient(to left,rgba(0,0,0,.28),rgba(0,0,0,0) 70%),var(--tone) right center/cover}

.bar{background:var(--well)}
.links,.btn{font-size:16px}

h2.ser{margin:0;font-weight:500}
.sec>h2.ser,.blk>h2.ser{color:var(--ink-2)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .ixl table{min-width:0}

  .ixl td{display:block;padding:0;border:0}

/* ---------- Phones (portrait): hall on top, flat caption on the floor below ---------- */
.cap,.snap{display:none}
html.compact.snapping{scroll-snap-type:y mandatory}
html.compact .snap{display:block;position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start;scroll-snap-stop:always;pointer-events:none}
html.compact .lab,html.compact .hint{display:none}
html.compact .cap{display:block;position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:var(--cap-top,59%);bottom:64px;color:var(--ink);transition:opacity .22s var(--e),transform .3s var(--e);z-index:3}
html.compact .cap.out{opacity:0;transform:translateY(8px);transition-duration:.12s}
.cap .m{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 8px;font-size:16px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cap .m span:first-child{color:var(--ink)}
.cap h2{margin:0 0 8px;font-size:24px;line-height:1.15;font-weight:500;letter-spacing:-.01em}
.cap h2 a{color:inherit;text-decoration:none}
.cap p{margin:0;font-size:16px;line-height:1.45;color:var(--ink-2);max-width:34em}
.cap .lead{color:var(--ink)}
.cap .acts{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:16px}
.cap .acts a,.cap .links a{display:inline-flex;align-items:center;min-height:44px}
.cap .links{margin-top:4px}
html.compact .it.arrived .leaf{transform:translateZ(-9px) rotateY(38deg)}
html.compact .map{height:44px}
html.compact .map .ln{top:30px}
html.compact .map .me{top:27px}
html.compact .map button{height:44px;padding-bottom:12px}
html.compact .map button.on{font-size:16px;color:var(--ink)}

html.compact .endw .links,html.compact .endw .foot-n{display:none}

  .map button{font-size:0;gap:0;justify-content:flex-end;padding-bottom:7px}
  .map button.on{font-size:16px}
  .map button::before{display:none}
}

/* caption never hides its links: long outcomes stop at three lines */
.cap>p:not(.m):not(.links){display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cap h2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap .nt{font:inherit;font-size:16px;color:var(--ink-2);background:none;border:0;padding:0;min-height:44px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
html.compact .top .who,html.compact .top nav a.hide-s{display:none}
html.compact .top{justify-content:flex-end}
html.compact .map button:focus-visible{font-size:16px;color:var(--ink)}
@media (max-height:620px){ .cap h2{font-size:22px} .cap .m{margin-bottom:4px} .cap .acts{margin-top:4px} }

/* phones on their side: hall on the left, caption panel on the right */
html.compact.cl .cap{left:auto;top:0;bottom:0;right:0;width:40%;padding:72px max(16px,env(safe-area-inset-right,0px)) 60px 20px;background:var(--floor);box-shadow:-1px 0 0 var(--rule);overflow-y:auto}

@media (max-width:360px){ .top nav{gap:10px} .switch button{padding:4px 8px} .top .theme{width:34px;height:34px} }

/* ---------- Type: EB Garamond for titles and statements, Host Grotesk for everything else ---------- */

:root:not([data-theme="dark"]){

    --rule:#2C2B28;--well:#222220;--leaf:#262522;--reveal:#33312D;--dot:rgba(237,235,230,.08);

/* story top: header left, device right on wide screens; phones keep the device above the text */

}

/* ⌘K search */
.kb-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--wall);color:var(--ink);cursor:pointer;font:inherit}

.kbar{position:fixed;inset:0;z-index:60}

.kb-box input{display:block;width:100%;box-sizing:border-box;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:20px;padding:18px 20px;outline:none}

.kb-none{color:var(--ink-2);cursor:default}
.kb-hint{display:flex;gap:18px;margin:0;padding:10px 20px;border-top:1px solid var(--rule);font-size:16px;color:var(--ink-2)}
@media (max-width:600px){ .kb-hint{display:none} }
.foot a{color:inherit}

/* Now page */
.now-list,.how{margin:0;padding-left:1.1em}
.now-list li,.how li{margin:0 0 12px}
.how b{font-weight:500}
.now-head{margin-bottom:48px}

/* ---- Motion: springs (after Maxime Heckel's spring posts). linear() curves sampled from a damped spring,
   so CSS gets spring motion with no library. --spring: quick UI (response .45s, damping .82, tiny overshoot).
   --glide: page moves (response .6s, damping .9, no visible overshoot). */
:root{
  --spring:linear(0,0.02,0.07,0.141,0.223,0.31,0.398,0.482,0.561,0.634,0.699,0.756,0.805,0.848,0.884,0.913,0.937,0.957,0.972,0.984,0.993,1,1.005,1.008,1.01,1.011,1.011,1.011,1.01,1.01,1.009,1.008,1.007,1.006,1.005,1.004,1.003,1.003,1.002,1.002,1);
  --glide:linear(0,0.016,0.059,0.118,0.187,0.261,0.337,0.411,0.481,0.547,0.608,0.664,0.713,0.757,0.796,0.83,0.859,0.884,0.905,0.923,0.938,0.951,0.961,0.97,0.977,0.983,0.987,0.991,0.994,0.996,0.998,0.999,1,1.001,1.001,1.001,1.001,1.002,1.002,1.001,1);
}
.theme svg{transition:transform .6s var(--spring)}
.back .dr{transition:transform .6s var(--spring)}
#scene .map .lg{transition:opacity .2s,transform .6s var(--spring)}
html.compact .cap{transition:opacity .22s var(--e),transform .6s var(--spring)}
.door .leaf{transition:transform .9s var(--glide)}
.it.opening .leaf{transition-duration:1s}
.story{animation:rise .73s var(--glide) both}
.kb-box{animation:kbIn .6s var(--spring) both}
.kb-veil{animation:kbVeil .2s ease-out both}
@keyframes kbIn{from{opacity:0;transform:translateY(-8px) scale(.97)}}
@keyframes kbVeil{from{opacity:0}}

/* Page transitions use the browser's View Transitions API: the title, meta line and screen are the same
   "shared elements" on both pages and the browser glides them; everything else fades. */
/* the one big move, after mikematas.com: a plain, symmetric ease-in-out, 0.55s. No spring tail, no overshoot. */
:root{--move:cubic-bezier(.4,0,.2,1);--move-d:.55s}
::view-transition-group(vt-art){animation:none;transform-origin:0 0}   /* moved by extras.js onHash, as one straight move */
::view-transition-old(vt-art){animation:vtOut .2s ease-out both}
::view-transition-new(vt-art){animation:vtIn .2s ease-out both}   /* the two renders of the screen swap quickly, then it simply moves */
::view-transition-group(*){animation-duration:var(--move-d);animation-timing-function:var(--move)}
::view-transition-old(root){animation:vtOut .2s ease-out both}
::view-transition-new(root){animation:vtIn .3s .3s ease-out both}   /* text arrives as the image lands */
@keyframes vtOut{to{opacity:0}}
@keyframes vtIn{from{opacity:0}}
@media (prefers-reduced-motion:reduce){ ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important} }

/* phones: keep the intro inside the screen (it starts right of the runner) */
@media (max-width:640px){ .intro{width:min(300px,calc(100vw - 136px))} }

/* ===== Concrete look (test). Ando-style board-formed concrete, overcast light from above, one red figure. =====
   html.concrete beats both theme blocks, so the look holds whichever mode the visitor is in. */
html.concrete:root{
  --paper:#2B2B2A;--wall:#5A5A59;--floor:#7A7977;--ink:#F4F3F0;--ink-2:#DEDDD9;--ink-3:#C9C8C4;--ink-far:#8C8B88;
  --rule:rgba(255,255,255,.18);--well:#3A3A39;--leaf:#6B6B69;--reveal:#474746;--lamp:#5F5F5D;--lamp-core:#77767400;
  --dot:transparent;--device:#1D1D1F;--device-edge:#3A3A3C;--red:#FF2A1C;
}
html.concrete .seg,html.concrete .door .patch{background-color:var(--wall);background-image:url(img/concrete-wall.jpg);background-size:480px 480px}
/* the floor is the lit top surface: brighter toward the wall, falling off toward us */
html.concrete #stage{background:linear-gradient(to bottom,#5F5E5C,#6A6967 40%,#575654)}
html.concrete body.in-scene{background:#575654}
html.concrete .ground{background:rgba(0,0,0,.42);height:3px;top:-2px}
/* rooms behind the doors are shadowed concrete, lit only by the project's own tone */
html.concrete .door .back{background:radial-gradient(90% 70% at 50% 65%,#6B6A68,#4A4A49 60%,#323231)}
html.concrete .door .rv.l{background:linear-gradient(to right,#3C3C3B,#5A5A58)}
html.concrete .door .rv.r{background:linear-gradient(to left,#3C3C3B,#5A5A58)}
html.concrete .door .rv.t{background:linear-gradient(to bottom,#2E2E2D,#4A4A48)}
html.concrete .door .rv.b{background:linear-gradient(to top,#5A5A58,#7A7977)}
/* the figure glows */
html.concrete #runner3d{filter:drop-shadow(0 0 3px rgba(255,42,28,.9)) drop-shadow(0 0 14px rgba(255,30,15,.55))}
html.concrete .switch{background:rgba(0,0,0,.18)}
html.concrete .switch button[aria-pressed="true"]{background:var(--ink);color:#2B2B2A}
html.concrete .map button::before{background:#3A3A39}
html.concrete .theme{background:rgba(0,0,0,.18)}

/* ===== Light = open sky. The wall is gone; only the doors stand in the air. ===== */
html.concrete.sky:root{
  --paper:#EAF4FF;--wall:transparent;--floor:transparent;--ink:#14202E;--ink-2:#26364A;--ink-3:#35455A;--ink-far:#8FA3B8;
  --rule:rgba(20,32,46,.2);--well:#F4F8FC;--leaf:#FFFFFF;--reveal:#D3DFEB;--lamp:#FFF3D6;--lamp-core:#FFFBF0;
}
html.concrete.sky .seg,html.concrete.sky .door .patch{background:none}
html.concrete.sky #stage{background:linear-gradient(to bottom,#5E8FC4 0%,#7FAAD8 30%,#B3CDE8 58%,#DCE6EE 74%,#3A8A36 74.1%,#2F7E2E 100%)}
html.concrete.sky body.in-scene{background:#1F6420}
html.concrete.sky .ground{display:none}
html.concrete.sky .door .back{background:radial-gradient(90% 70% at 50% 65%,#FFFFFF,#EAF3FB 60%,#C9DAEA)}
html.concrete.sky .door .rv.l{background:linear-gradient(to right,#C9DAEA,#F4F8FC)}
html.concrete.sky .door .rv.r{background:linear-gradient(to left,#C9DAEA,#F4F8FC)}
html.concrete.sky .door .rv.t{background:linear-gradient(to bottom,#B9CCE0,#E8F0F8)}
html.concrete.sky .door .rv.b{background:linear-gradient(to top,#FFFFFF,#E8F0F8)}
html.concrete.sky #runner3d{filter:drop-shadow(0 0 3px rgba(255,42,28,.55)) drop-shadow(0 10px 14px rgba(30,70,120,.18))}
html.concrete.sky .switch,html.concrete.sky .theme{background:rgba(255,255,255,.55)}
html.concrete.sky .switch button[aria-pressed="true"]{background:var(--ink);color:#fff}
html.concrete.sky .map button::before{background:#fff}

/* clouds and a rainbow, behind the doors */
.sky-l{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .2s}
html.concrete.sky .sky-l{opacity:1}
.sky-l i{position:absolute;display:block}
.sky-l .cl{width:360px;height:170px;left:100%;
  background:
    radial-gradient(circle 48px at 26% 62%,#fff 96%,transparent 100%),
    radial-gradient(circle 64px at 47% 48%,#fff 96%,transparent 100%),
    radial-gradient(circle 50px at 69% 58%,#fff 96%,transparent 100%),
    radial-gradient(circle 36px at 85% 68%,#fff 96%,transparent 100%),
    radial-gradient(ellipse 150px 34px at 54% 74%,#fff 96%,transparent 100%);
  filter:blur(2.5px) drop-shadow(0 12px 14px rgba(40,90,150,.14));animation:drift 90s linear infinite}
.sky-l .c1{top:7%;animation-duration:110s;animation-delay:-20s}
.sky-l .c2{top:24%;transform:scale(.6);animation-duration:150s;animation-delay:-95s;opacity:.85}
.sky-l .c3{top:3%;animation-duration:130s;animation-delay:-70s;transform:scale(1.3)}
.sky-l .c4{top:44%;animation-duration:170s;animation-delay:-140s;opacity:.7;transform:scale(.45)}
.sky-l .c5{top:15%;animation-duration:120s;animation-delay:-115s;transform:scale(.8)}
@keyframes drift{from{translate:0 0}to{translate:calc(-100vw - 520px) 0}}
.sky-l .bow{width:1100px;height:1100px;left:calc(50% - 150px);top:16%;border-radius:50%;
  background:radial-gradient(closest-side,transparent 80%,rgba(255,40,40,.32) 81%,rgba(255,150,0,.32) 83%,rgba(255,230,0,.32) 85%,rgba(40,200,90,.3) 87%,rgba(30,140,255,.3) 89%,rgba(120,70,220,.28) 91%,transparent 93%);
  -webkit-mask-image:linear-gradient(to bottom,#000 28%,transparent 44%);mask-image:linear-gradient(to bottom,#000 28%,transparent 44%);filter:blur(1.5px)}
@media (max-width:700px){ .sky-l .bow{width:700px;height:700px;left:-120px;top:22%} .sky-l .cl{width:220px;height:84px} }
@media (prefers-reduced-motion:reduce){ .sky-l .cl{animation:none;left:auto;right:10%} }

/* the switch between worlds: a quick glitch */
html.glitch #stage{animation:glitch .56s steps(1) both}
html.glitch #stage::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 2px,transparent 2px 5px);mix-blend-mode:multiply;animation:scan .56s steps(1) both}
@keyframes glitch{
  0%{transform:none;filter:none;clip-path:none}
  8%{transform:translate(-10px,0) skewX(5deg);filter:drop-shadow(8px 0 0 rgba(255,0,60,.85)) drop-shadow(-8px 0 0 rgba(0,240,255,.85));clip-path:inset(12% 0 52% 0)}
  18%{transform:translate(12px,3px);filter:invert(1) hue-rotate(160deg);clip-path:inset(46% 0 18% 0)}
  28%{transform:translate(-5px,-2px) scaleY(1.04);filter:contrast(2.2) saturate(3);clip-path:inset(0 0 66% 0)}
  38%{transform:translate(7px,0);filter:drop-shadow(-12px 0 0 rgba(255,0,60,.85)) drop-shadow(12px 0 0 rgba(0,240,255,.85)) brightness(1.5);clip-path:inset(62% 0 4% 0)}
  50%{transform:translate(-14px,0) skewX(-6deg);filter:hue-rotate(90deg) saturate(4);clip-path:inset(24% 0 40% 0)}
  62%{transform:translate(4px,0);filter:drop-shadow(5px 0 0 rgba(255,0,60,.8)) drop-shadow(-5px 0 0 rgba(0,240,255,.8));clip-path:inset(0 0 8% 0)}
  76%{transform:translate(-2px,0);filter:contrast(1.5);clip-path:none}
  88%,100%{transform:none;filter:none;clip-path:none}
}
@keyframes scan{0%{opacity:1;transform:translateY(0)}30%{transform:translateY(3px)}60%{opacity:.6;transform:translateY(-2px)}100%{opacity:0}}

/* grass floor: one 17 KB tile on a plane, so perspective is real and nothing else loads */
.turf{display:block;position:absolute;top:0;height:640px;transform-origin:0 0;transform:rotateX(90deg);
  background:#5E5D5B url(img/concrete-floor.jpg) 0 0/480px 480px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0,#000 70%,transparent);mask-image:linear-gradient(to bottom,#000 0,#000 70%,transparent)}
html.concrete.sky .turf{background:#2F7E2E url(img/grass.jpg) 0 0/180px 180px}
/* soft wispy streaks instead of cartoon puffs, like a long-lens sky */
html.concrete.sky .sky-l .cl{width:620px;height:90px;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);filter:blur(10px)}
html.concrete.sky .sky-l .bow{opacity:.55}
/* the map and hint sit on grass now: keep them legible */
html.concrete.sky .map::before{content:"";position:absolute;inset:-10px -12px -8px;background:rgba(242,248,253,.9);border-radius:12px}
html.concrete.sky .hint{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* dark: the cursor is a soft lamp on the concrete */
.torch{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .6s;mix-blend-mode:soft-light;
  background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,244,228,.85),rgba(255,244,228,.25) 45%,transparent 72%)}
#stage.lit .torch{opacity:1}
html.concrete.sky .torch{display:none}

/* ---------------- Jones ---------------- */
"jones": {
  fact:"Jones · Jul 2024 to Jul 2025 · Sole designer",
  title:"Track As You Go",
  lede:"Logging nicotine in the moment, not the morning after.",
  facts:[["Role","Sole designer, contract"],["Worked with","PM and engineering leads"],["Platforms","iOS and Android"],["Shipped","March 2025"]],
  hero:"jones",
  blocks:[
    {k:"Problem", html:
      "<p>Jones helps users quit vaping with nicotine mints and an app. The app's core habit was a daily check-in, and tracking only happened there: once a day, for the day before, from memory.</p>"+
      "<p>Users reach for a vape or a mint many times a day, so by the next morning the count is a guess. Our own community said so first.</p>"+
      "<blockquote class='quote'>“how do you guys keep track of how many times you hit your vape??? this app is so confusing honestly”<small>Jones community post, Jan 2025. A reply: “I keep track in the notes app on my phone every time I take a few puffs.”</small></blockquote>"},
    {k:"What we bet on", html:"<p>If logging took one tap at the moment of use, users would log more often and more honestly, and the check-in could arrive already filled in.</p>"+
      "<p class='full'>On the Q4 2024 prioritization sheet, real-time tracking scored below several quick wins. We picked it anyway because it served the quarter's habit goal directly: help users build a daily habit.</p>"+
      "<div class='note'><b>Check:</b> the prioritization point comes from the Q4'24 RICE sheet (3.5 vs 9.5 for in-app blogs). Confirm it matches your memory before it goes live.</div>"},
    {k:"Three calls", calls:[
      {t:"Tap to log, hold to batch-log", no:"Instead of long press for every log",
       why:"<p>Reviews 1 and 2 logged with a long press, because a long press is deliberate. In Review 3 I swapped it: the most frequent action should take the least effort, so a single tap logs one.</p>"+
           "<p>Hold came back later with a different job. Many users didn't log vape hits as they happened. They came back at the end of the day and logged them all at once, often in the tens. So press and hold counts up at a steady rate. Your thumb covers the number while you hold, so a toast at the top shows the running count.</p>"},
      {t:"Two cards, not one", no:"Instead of one merged tracking and check-in card",
       why:"<p>My first question was whether we needed both. Could the first log of the day start the check-in in the same card? I explored it, and splitting won for one reason: <b>splitting the cards allows for reordering.</b></p>"+
           "<p>Tracking is a one-tap log in the moment. The check-in is reflection: a post, how you're feeling, an AI summary. As separate cards, Home changes with the day. Before you've checked in, the check-in card comes first. After that, tracking moves up. The check-in then asks you to confirm or amend what you tracked, so nothing is logged twice.</p>"},
      {t:"On Home, not in a tab", no:"Instead of a Track tab in the footer, and a −/+ stepper on every row",
       why:"<p>A footer tab gave tracking a permanent home, but tracking should take zero navigation. It sits on Home, next to the check-in. A −/+ stepper on every row made corrections easy and the home screen heavy, so corrections moved into the edit sheet and each row kept a single +.</p>"}
    ]},
    {k:"Outcome", html:"<div class='stats'><div><b>290K</b><span>taps to log</span></div><div><b>~7K</b><span>users tracking</span></div><div><b>41</b><span>logs per user</span></div></div>"+
      "<p class='src'>Google Analytics, Feb 14 to Jul 14, 2025. Taps held at 15–20K a week from launch through July.</p>"+
      ""+
      "<div class='note'><b>Before publishing:</b> check your contractor agreement, and Jones if needed, before these numbers go live. These show adoption and sustained use, not a retention lift, so the copy doesn't claim one.</div>"}
  ],
  full:[
    {fig:"img/jones-question.jpg", dark:true, narrow:true, cap:"From my exploration notes: “Do we need both real-time tracking and check-in?” DIR 1 tried to merge them. DIR 2, separate cards with modular tracking, shipped."},
    {k:"What I weighed", html:"<div class='tbl'><table><thead><tr><th>Direction</th><th>Why it was tempting</th><th>Why I moved on</th></tr></thead><tbody>"+
      "<tr><td>Tracking as its own tab in the bottom nav</td><td>A permanent home</td><td>Tracking should take zero navigation</td></tr>"+
      "<tr><td>One merged card, where the first log starts the check-in</td><td>One habit, one place</td><td>It blurred the quick log and the reflective check-in</td></tr>"+
      "<tr><td>A −/+ stepper on every row</td><td>Easy to fix mistakes</td><td>Too heavy for Home; moved into the edit sheet</td></tr>"+
      "<tr class='won'><td>Shipped: two cards that talk to each other</td><td>Each keeps its own job</td><td>The check-in pre-fills from tracking</td></tr>"+
      "</tbody></table></div><div class='note'><b>Check:</b> the middle column is my reading of why each option was tempting. Edit to match your memory.</div>"},
    {fig:"img/jones-options.jpg", dark:true, cap:"Option 1 folded tracking into the journey card and logged with a long press. Option 2 split check-in and Track As You Go into two cards. My annotation on the board: splitting the cards allows for reordering."},
    {fig2:["img/jones-footer-test.jpg","img/jones-buttons.jpg"], dark:true, cap:"Left: the footer test, tracking in its own tab against the current Home. Right: early button and stepper explorations for mint, puff and extra."},
    {k:"Hold to batch-log", html:"<p>Press and hold counts up at a steady rate for heavy-use days. The toast moved to the top of the screen because the thumb covers the tile.</p>"},
    {strip:"hold", cap:"Holding on mints in the prototype: the count rises and the toast at the top confirms “1 mint added”, then “2 mints added”."},
    {k:"Designing for inconsistency", html:"<p>Quitting isn't linear, so the small states mattered as much as the happy path.</p><ul>"+
      "<li>Users pick what they track: mint, vape, cigs or pouch, up to three on Home. Turning on a fourth says why: “You can only have 3 cards on the Homepage!”</li>"+
      "<li>Mints get a strength and a daily limit. At the limit the card says “You have reached your limit for the day!”</li>"+
      "<li>The first version wouldn't let you turn off a tracker that had data. We changed it so hiding a card leaves the data alone.</li>"+
      "<li>A failed log says “Didn't go through. Try again.” and nothing more.</li>"+
      "<li>I wrote truth tables for “Hit the vape yesterday?” against whether tracking happened and whether the count was zero, so the check-in never contradicts the tracker.</li></ul>"},
    {grid:"states", cap:"Settings per tracker, the three-card limit, hiding a card, the daily limit, and a failed log. Swipe for more."},
    {k:"What users said", html:"<p>In about ten interviews in spring 2025, which I co-led with our PM, users liked it. One called it “useful for awareness”, another said it “would have been really helpful for my early stage”.</p>"+
      "<p>They also told us what we missed. Subtracting was hard to find: it sat behind the chevron, and one user said it was “a little hidden”. Several asked to track gum. And one user said she had no bandwidth for logging at all: “I can't count my puffs.” Not everyone wants to count, and the check-in still has to work for them.</p>"},
    {k:"What I owned", html:"<ul><li>Framed the core question and explored the directions above</li><li>The interaction model, tap and hold-to-count, and every card, settings and error state</li><li>Redlines from P0 (Dec 9) to P1 final (Feb 12), then the Feb 28 bug bash with engineering</li><li>Made the case for this bet over higher-scoring roadmap items</li></ul><div class='note'><b>Check:</b> confirm you made this case. The sources show it was picked despite a lower score, not who argued for it.</div>"},
    {k:"What came next", html:"<ul><li><b>A home-screen widget.</b> I prototyped one in SwiftUI so logging doesn't need the app open.</li><li><b>Quit plans.</b> Tracking was designed to feed a personal plan, with actual against planned use each month. It was ready for development when my contract ended.</li><li><b>SMS logging.</b> Text “PUFF” or “MINT” to log. Cut because feasibility was unresolved.</li></ul>"}
  ],
  tryIt:true
},

  fact:"Microsoft · 2020–21 · First designer on the team",
  title:"Viva Learning",
  lede:"I led the end-to-end design of the Viva Learning mobile app from zero to one, for iOS and Android, crafting every user flow with a strong emphasis on accessibility.",
  facts:[["Role","First designer on the team"],["Worked with","Engineering and product"],["Platforms","iOS, Android, desktop"],["Stage","0 to 1"]],
  hero:"viva",
  locked:true,
  noteTop:"Rewritten from your Viva page on barthysuraj.com. The years come from your About page (Microsoft 2020–21); confirm they cover Viva. Named teammates are left off the public page.",
  blocks:[
    {k:"Context", html:"<p>Viva Learning is Microsoft's learning hub inside Teams. It brings courses from LinkedIn Learning, Microsoft Learn and Skillsoft into one place. Employees, managers and HR teams use it.</p>"+
      "<p>I was the first designer on the team. I led mobile from zero to one on Android and iOS, in light and dark, contributed to key desktop flows, and helped move the desktop product over from our Seattle partners. As the team grew, I set up the design team's workflows. <span class='tbd'>[confirm this was you]</span></p>"},
    {k:"Problem", html:"<p>Before launch, learning at work was scattered. Employees struggled to find relevant content across separate platforms, engagement was low, and the tools didn't serve everyone equally well.</p>"},
    {k:"Three areas", calls:[
      {t:"Search and discover", no:"Filters for provider, topic, duration and skill level, with trending content and recommendations from Microsoft Graph",
       why:"<p><span class='tbd'>[One call you made here and what you chose it over. Your page mentions aligning with engineering on a 3- versus 4-character search term; that could be the story.]</span></p>"},

       why:"<p><span class='tbd'>[One call about personal learning on a small screen.]</span></p>"}

    {k:"Accessibility", html:"<p>The app targets WCAG 2.1 AA: screen readers, keyboard navigation, adjustable text size and contrast, and light and dark modes across Android, iOS, web and desktop, following Microsoft's accessibility standards.</p>"},
    {k:"Outcome", html:"<div class='stats'><div><b>169K</b><span>monthly active users, Viva Learning overall, a year after launch</span></div><div><b>~40K</b><span>of them on the mobile app</span></div><div><b>0 → 1</b><span>mobile, iOS and Android</span></div></div>"+

var REDUCE = false; try{ REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}

var TONE = {"jones":"img/tone-jones.jpg", "everydays":"img/tone-everydays.jpg"};   // made from the Jones Home screen: its saturated colours, spread and blurred

function kindOf(it){

/* Phones in portrait: the hall takes the top half, the floor below carries a flat caption. */
/* Phones on their side: the hall takes the left, the caption sits in a panel on the right. */
var COMPACT = false, CL = false;
function isCompact(){
  var w = window.innerWidth, h = window.innerHeight;
  return (w < 700 && h > w) || (h < 500 && w > h && w < 1000);
}
function shapeChanged(){ var c = isCompact(); return c!==COMPACT || (c && (window.innerWidth > window.innerHeight)!==CL); }
function gf(){ return H < 620 ? 0.45 : H < 760 ? 0.47 : 0.54; }   // where the ground sits on a portrait phone
function stopY(o){
  var y = COMPACT ? o.x - (CL ? 100 : Math.round(window.innerWidth*0.24)) : o.x - (o.kind==="line"?150:230);
  return clamp(y, 0, SMAX);
}

function layout(){
  COMPACT = isCompact(); CL = COMPACT && window.innerWidth > window.innerHeight;
  var x = X0;
  SC = ITEMS.map(function(it){
    var k = kindOf(it), d = DIMS[k], art = ART[it.id];
    var o = {it:it, id:it.id, kind:k, x:x, h:d.h, w:d.w, pl:-9, aw: art ? ARTW[art.type] : 0};
    x += COMPACT ? (k==="line" ? 420 : d.w + 40 + (o.aw ? o.aw + 28 : 0) + 300)
                 : (k==="line" ? 520 : d.w + 30 + LABW + (o.aw ? o.aw*ARTX[ART[it.id].type] + 36 : 0) + 170);
    return o;
  });
  XEND = x + 60;
  SMAX = XEND - 140;
}

function mapKnots(){

function toMap(x){

/* ---------- small math ---------- */
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function lerp(a,b,k){ return a+(b-a)*k; }
function sstep(a,b,v){ var x = clamp((v-a)/(b-a),0,1); return x*x*(3-2*x); }
/* moves on the first frame, settles slowly */
function easeCam(x){ return 0.6*(1-Math.pow(1-x,3)) + 0.4*easeIO(x); }
function easeIO(x){ return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }
var D2R = Math.PI/180;

/* Periodic Catmull-Rom through keyframes [[phase, value], ...], phase in [0,1). Keyed the way
   you'd key a graph editor: poses at contact, down, passing, up. */
function curve(keys){
  return function(p){
    p = ((p%1)+1)%1;
    var n = keys.length, i = 0;
    while(i<n-1 && keys[i+1][0]<=p) i++;
    var k0 = keys[(i-1+n)%n], k1 = keys[i], k2 = keys[(i+1)%n], k3 = keys[(i+2)%n];
    var t0 = k1[0], t1 = k2[0] + (i+1>=n?1:0);
    var u = (p - t0)/(t1 - t0);
    var a = k0[1], b = k1[1], c = k2[1], d = k3[1];
    return 0.5*((2*b) + (-a+c)*u + (2*a-5*b+4*c-d)*u*u + (-a+3*b-3*c+d)*u*u*u);
  };
}

var FOOT  = curve([[0,-14],[.12,0],[.25,0],[.38,34],[.5,58],[.62,40],[.78,8],[.9,-12]]);

var WFOOT  = curve([[0,-18],[.12,0],[.4,0],[.55,20],[.62,34],[.75,6],[.9,-12]]);

function camCY(){ return !COMPACT ? H/2 : CL ? H*0.5 : H*(gf()-0.24); }
function camSetup(m){

  var sc2 = Math.max(0.45, Math.min(1, (H*0.72 - 70)/560));

    } else {
      var s2 = Math.min(1, H/(H < 620 ? 980 : 820));   // shorter phones: step back so tall screens on the wall clear the header
      A2 = {yaw:0, pitch:0, f:3600, D:3600/s2, lead:W*0.38/s2, ty:(cy - H*gf())/s2};
      B2 = {yaw:20, pitch:4, f:W*1.4, D:860, lead:250, ty:-150};
    }
    return {yaw:lerp(A2.yaw,B2.yaw,m), pitch:lerp(A2.pitch,B2.pitch,m),
      f:Math.exp(lerp(Math.log(A2.f),Math.log(B2.f),m)), D:Math.exp(lerp(Math.log(A2.D),Math.log(B2.D),m)),

  }
  var A = {yaw:0, pitch:0, f:3600, D:3600/sc2, lead:(W*(narrow?0.38:0.28))/sc2, ty:-(H*(narrow?0.2:0.22))/sc2, tz:0};
  var B = narrow
    ? {yaw:30, pitch:5, f:W*1.25, D:560/sc2, lead:200/sc2, ty:-150/sc2, tz:0}
    : {yaw:36, pitch:5.5, f:Math.max(W*0.72,760), D:760/sc2, lead:350/sc2, ty:-112, tz:0};
  var k = m;
  return {
    yaw: lerp(A.yaw,B.yaw,k), pitch: lerp(A.pitch,B.pitch,k),
    f: Math.exp(lerp(Math.log(A.f),Math.log(B.f),k)), D: Math.exp(lerp(Math.log(A.D),Math.log(B.D),k)),
    lead: lerp(A.lead,B.lead,k), ty: lerp(A.ty,B.ty,k), tz:0

function buildCam(){
  var c = camSetup(M);

/* ---------- the runner ---------- */
/* Proportions: 132 units tall against a 250 door. Thigh 34, shin 33, torso 40, head r 9. */
function pose(time){
  var a = amp, g = gaitRun, spr = sprint;
  var settle = 1 - sstep(4, 5, idleFor);           // idle motion stops after five seconds (WCAG 2.2.2)
  var lean = (4 + 3*a + 8*g*a + 4*spr)*D2R, breathe = Math.sin(time*1.6)*0.7*(1-a)*settle;
  var sway = Math.sin(time*0.55)*(1-a)*settle;     // idle: weight drifts between feet
  var legs = [], arms = [];
  for(var side=0; side<2; side++){
    var p = phase + side*0.5;
    var idleT = side ? 2 + sway*2 : -3 + sway*2;
    var idleK = side ? 3 : 9 - sway*4;               // one knee relaxed
    var th = lerp(idleT, lerp(WTHIGH(p), THIGH(p)*(1+0.22*spr), g), a)*D2R;
    var kn = lerp(idleK, lerp(WKNEE(p), KNEE(p), g), a)*D2R;
    var fa = lerp(0, lerp(WFOOT(p), FOOT(p), g), a)*D2R;
    var knee = [Math.sin(th)*34, Math.cos(th)*34];
    var sh = th - kn;
    var ank = [knee[0]+Math.sin(sh)*33, knee[1]+Math.cos(sh)*33];
    var toe = [ank[0]+Math.cos(fa)*11, ank[1]+Math.sin(fa)*11];
    var heel = [ank[0]-Math.cos(fa)*2.5, ank[1]-Math.sin(fa)*2.5];

    var swing = lerp(-0.6*WTHIGH(p) + 3, -0.95*THIGH(p)*(1+0.2*spr) + 6, g);
    var arm = lerp(4 + sway*1.5, swing, a)*D2R;
    var el = lerp(12, lerp(20 + 6*Math.sin(p*2*Math.PI), 88 + 14*Math.sin((p+0.1)*2*Math.PI), g), a)*D2R;
    arms.push({a:arm, e:el, z:side? 9:-9});

  var lift = LIFT(phase)*g*a;
  var ph = low + lift;
  var pel = [sway*1.2, -ph];
  var neck = [pel[0]+Math.sin(lean)*40, pel[1]-Math.cos(lean)*40 + breathe];
  var head = [neck[0]+Math.sin(lean*0.6)*13, neck[1]-Math.cos(lean*0.6)*13];
  var shoulder = [neck[0]-Math.sin(lean)*4, neck[1]+Math.cos(lean)*4];
  var J = {pel:pel, neck:neck, head:head, legs:[], arms:[], lift:lift};
  legs.forEach(function(l){
    J.legs.push({z:l.z, w:[4.8,3.7,2.8], pts:[[pel[0],pel[1],l.z*0.8],[pel[0]+l.knee[0],pel[1]+l.knee[1],l.z],[pel[0]+l.ank[0],pel[1]+l.ank[1],l.z],[pel[0]+l.toe[0],pel[1]+l.toe[1],l.z]]});
  });

    var el = [shoulder[0]+Math.sin(r.a)*22, shoulder[1]+Math.cos(r.a)*22];
    var fa = r.a + r.e;
    var hand = [el[0]+Math.sin(fa)*20, el[1]+Math.cos(fa)*20];
    J.arms.push({z:r.z, w:[3.6,2.9], pts:[[shoulder[0],shoulder[1],r.z*0.7],[el[0],el[1],r.z],[hand[0],hand[1],r.z*0.9]]});

}
function toWorld(p){
  // turn about the vertical axis (faceA: 0 = facing +x, PI = facing -x), then place at the runner

}
function drawRunner(time){
  // once the 3D figure has fully taken over, only the airborne lift is needed (for the shadow)
  var J = R3 && R3k>=1 ? {lift:LIFT(phase)*gaitRun*amp} : pose(time);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // light from an open door, pooled on the floor in front of the threshold
  if(hoverAmt>0.01 && hoverDoor && M>0.5){
    var o = hoverDoor, k = hoverAmt*sstep(.5,1,M);
    var q = [project(o.x+2,0,1), project(o.x+o.w-2,0,1), project(o.x+o.w+46,0,190), project(o.x-46,0,190)];
    var m0 = project(o.x+o.w/2,0,1), m1 = project(o.x+o.w/2,0,190);
    var g = ctx.createLinearGradient(m0.x,m0.y,m1.x,m1.y);

    g.addColorStop(0, hexA(lc, .7*k)); g.addColorStop(.45, hexA(lc, .28*k)); g.addColorStop(1, hexA(lc, 0));

    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(q[0].x,q[0].y); q.forEach(function(p){ ctx.lineTo(p.x,p.y); }); ctx.closePath(); ctx.fill();

  if(LOOK && !document.documentElement.classList.contains("sky")){
    var lk = R3 ? Math.min(1, R3k) : 0;
    if(lk > 0){
      var glow = function(cx, cy, cz, ax, ay, az, bx, by, bz, a){

        ctx.restore();

  ctx.fillStyle = LOOK ? "#000" : COL["--ink"];
  ctx.setTransform(DPR*(ca.x-c0.x), DPR*(ca.y-c0.y), DPR*(cb.x-c0.x), DPR*Math.max(cb.y-c0.y, .9), DPR*c0.x, DPR*c0.y);
  ctx.beginPath(); ctx.arc(0,0,1,0,Math.PI*2); ctx.fill();
  ctx.restore();
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(R3){

    R3.render({cam:cam, W:W, H:H, x:S, z:RZ, faceA:faceA, amp:amp, gait:gaitRun, sprint:sprint, spd:Math.abs(V),
      dt:Math.min(0.05, R3dt), idleRate:REDUCE ? 0 : 1 - sstep(4, 5, idleFor), dark:isDark(),
      still:idleFor, reduce:REDUCE});
    if(R3k>=1) return;
    ctx.globalAlpha = 1 - R3k;
  }
  var segs = [];
  J.legs.forEach(function(l){ segs.push({pts:l.pts.map(toWorld), z:l.z, w:l.w}); });
  J.arms.forEach(function(a){ segs.push({pts:a.pts.map(toWorld), z:a.z, w:a.w}); });
  var pel = toWorld([J.pel[0],J.pel[1],0]), neck = toWorld([J.neck[0],J.neck[1],0]), head = toWorld([J.head[0],J.head[1],0]);

  ctx.globalAlpha = 1;
}

/* ---------- the 3D runner (Three.js), loaded after the hall is up; the stick figure stays as the fallback ---------- */
var R3 = null, R3cv = null, R3k = 0, R3dt = 0, R3state = "";
function loadRunner3D(){
  if(R3state) return;
  R3state = "loading";
  var go = function(){
    window.createRunner3D({canvas:R3cv, url:"models/runner.glb.wasm", look:LOOK}).then(function(api){
      R3 = api; R3state = "ready"; R3.resize(W, H, DPR); R3cv.classList.add("on");
    }, function(e){ R3state = "failed"; if(R3cv) R3cv.remove(); R3cv = null; if(window.console) console.warn("3D runner unavailable:", e && e.message); });
  };
  if(window.createRunner3D){ go(); return; }
  var sc = document.createElement("script");
  sc.src = "js/runner3d.js"; sc.async = true;
  sc.onload = function(){ if(window.createRunner3D) go(); else sc.onerror(); };
  sc.onerror = function(){ R3state = "failed"; if(R3cv){ R3cv.remove(); R3cv = null; } };
  document.head.appendChild(sc);
}
function hexA(c,a){
  var m = /^#([0-9a-f]{6})$/i.exec(c||"");
  if(!m) return "rgba(255,244,218,"+a+")";
  var n = parseInt(m[1],16); return "rgba("+(n>>16&255)+","+(n>>8&255)+","+(n&255)+","+a+")";
}

/* ---------- per frame ---------- */
var itEls = [], segEls = [], prevS = 0, wallTexts = [];
function frame(now){
  if(!sceneOn){ running = false; return; }
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - (lastT||now))/1000); lastT = now; R3dt = dt;
  var time = now/1000;

  // follow the scroll with a critically damped spring: the runner accelerates, never teleports
  target = clamp(window.scrollY, 0, SMAX);
  if(COMPACT) PACE = PACE_RUN;      // phones move one item per swipe: always the run
  if(REDUCE){ S = target; V = 0; }
  else {
    var w = PACE.follow, acc = w*w*(target - S) - 2*w*V;
    V += acc*dt; V = clamp(V, -PACE.vmax, PACE.vmax); S += V*dt;
    if(Math.abs(target-S)<0.05 && Math.abs(V)<0.5){ S = target; V = 0; }
  }
  var spd = Math.abs(V);
  var want = REDUCE ? 0 : sstep(3, 50, spd);
  amp += (want - amp)*Math.min(1, dt*(want>amp?8:5));
  gaitRun += ((REDUCE?0:sstep(PACE.run[0], PACE.run[1], spd)) - gaitRun)*Math.min(1, dt*5);
  sprint += (sstep(PACE.sprint[0], PACE.sprint[1], spd) - sprint)*Math.min(1, dt*4);
  // cadence follows the distance covered by the stride he is actually taking, so feet don't slide
  var stride = lerp(73, 160, gaitRun)*(1 + 0.22*sprint)*Math.max(amp, 0.2);
  var cad = Math.min(spd/stride, 3.4);
  phase = (phase + cad*dt)%1;
  idleFor = (amp < 0.02 && F===0 && M===mTo) ? idleFor + dt : 0;
  if(spd>30){ var nf = V>0?1:-1; if(nf!==face) face = nf; }
  var fa = face>0 ? 0 : Math.PI;
  faceA += (fa - faceA)*Math.min(1, dt*10);

  // camera mode and door focus
  if(M!==mTo){ var k = REDUCE?1:clamp((now - mT0)/MDUR,0,1); M = lerp(mFrom, mTo, easeCam(k)); if(k>=1) M = mTo; }
  if(F!==fTo){ var kf = REDUCE?1:clamp((now - fT0)/FDUR,0,1); F = lerp(fFrom, fTo, kf); if(kf>=1){ F = fTo; if(F===0) focus = null; } }

  buildCam();
  stage.style.perspective = cam.f.toFixed(2)+"px";
  stage.style.perspectiveOrigin = cam.cx+"px "+cam.cy+"px";
  world.style.transform = "matrix3d("+[cam.r[0],cam.u[0],cam.b[0],0, cam.r[1],cam.u[1],cam.b[1],0, cam.r[2],cam.u[2],cam.b[2],0, cam.tx,cam.ty,cam.tz,1].map(function(v){ return +v.toFixed(6); }).join(",")+")";

  var cur = null;
  SC.forEach(function(o,i){
    var el = itEls[i];
    var dep = depthOf(o.x + o.w/2, -o.h/2, 0);
    var dep2 = depthOf(o.x + 24 + LABW + 28 + (o.aw || 0) + 40, -o.h/2, 0);   // the far edge of the hung art
    var vis = (dep > 30 || dep2 > 30) && (project(o.x,0,0).x < W+400 || M<0.5);

      el._mi = mi;

        o.jt.style.transform = "translateZ(1px) scaleX("+sstep(.06,.4,mi).toFixed(3)+")";
        o.jr.style.transform = "translateZ(1px) scaleY("+sstep(.22,.55,mi).toFixed(3)+")";

      if(o.door){

}

function bindOnce(){

  try{ new MutationObserver(readColors).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme","class","style"]}); }catch(e){}

    var g = e.target.closest("[data-go]");

  window.addEventListener("resize", function(){
    if(!sceneOn) return;

/* 2D open: everything else fades to the page colour while the title and meta line glide to the
   story's header on the left and the screen glides to the hero on the right. Then the page fades in
   under them and they hand over. */
var flipParts = null, flipLayer = null;
function flipOpen(o, id){
  flipLayer = document.createElement("div");
  flipLayer.setAttribute("aria-hidden", "true");
  flipLayer.style.cssText = "position:fixed;inset:0;z-index:45;pointer-events:none";
  document.body.appendChild(flipLayer);
  var parts = [], hid = [];
  function grab(el, to){
    if(!el) return;
    var r = el.getBoundingClientRect(), cs = getComputedStyle(el), w = el.offsetWidth || 1, s = r.width / w;
    var c = el.cloneNode(true);
    c.removeAttribute("id");
    Array.prototype.forEach.call(c.querySelectorAll("a"), function(x){ x.style.textDecoration = "none"; x.style.color = "inherit"; });
    c.style.cssText = "position:absolute;left:0;top:0;margin:0;box-sizing:border-box;width:"+w+"px;transform-origin:0 0;"+
      "transform:translate("+r.left+"px,"+r.top+"px) scale("+s+");color:"+cs.color+";font-family:"+cs.fontFamily+";font-size:"+cs.fontSize+
      ";font-weight:"+cs.fontWeight+";line-height:"+cs.lineHeight+";letter-spacing:"+cs.letterSpacing+";opacity:1";
    flipLayer.appendChild(c);
    el.style.visibility = "hidden";      // the clone stands in for it; restored when the hall comes back
    hid.push(el);
    parts.push({c:c, to:to, x:r.left, y:r.top, s:s, w:w, fs:parseFloat(cs.fontSize)});
  }
  // only the screen glides; the text fades with the page (Suraj, 2026-11-15)
  if(o.hang) grab(o.hang.querySelector(".art"), ".hero .phone,.hero .lap,.hero .win,.hero .tiles,.hero > *");
  flipParts = parts;
  setTimeout(function(){ hid.forEach(function(e){ e.style.visibility = ""; }); }, 1400);
  curtain.style.clipPath = "";
  var a = curtain.animate([{opacity:0},{opacity:1}],{duration:300,easing:"cubic-bezier(.4,0,.2,1)",fill:"forwards"});
  a.onfinish = function(){ curtain.style.opacity = 1; a.cancel(); location.hash = id; };
}
function flipLand(){
  var parts = flipParts; flipParts = null;
  var st = app.querySelector(".story"); if(st) st.style.animation = "none";
  app.style.opacity = "0";
  var E = "cubic-bezier(.4,0,.2,1)", n = parts.length, done = 0;
  function finish(){
    curtain.style.opacity = 0;
    var f = app.animate([{opacity:0},{opacity:1}],{duration:240,easing:"ease-out"});
    f.onfinish = function(){ app.style.opacity = ""; };
    var g = flipLayer.animate([{opacity:1},{opacity:0}],{duration:240,easing:"ease-out",fill:"forwards"});
    var L = flipLayer; flipLayer = null;
    g.onfinish = function(){ L.remove(); busy = false; };
  }
  if(!n){ finish(); return; }
  parts.forEach(function(p){
    var t = app.querySelector(p.to), from = "translate("+p.x+"px,"+p.y+"px) scale("+p.s+")", to = from;
    if(t){
      var r = t.getBoundingClientRect();
      var s = p.fs && t.matches("h1,p") ? parseFloat(getComputedStyle(t).fontSize)/p.fs : r.width/p.w;
      to = "translate("+r.left+"px,"+r.top+"px) scale("+s+")";
    }
    var a = p.c.animate([{transform:from},{transform:to}],{duration:550,easing:E,fill:"forwards"});
    a.onfinish = function(){ if(++done===n) finish(); };
  });
}

var tocObs = null;
function slug(s){ return String(s).toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
function buildToc(){
  if(tocObs){ tocObs.disconnect(); tocObs = null; }
  var old = document.getElementById("toc"); if(old) old.remove();
  var st = app.querySelector(".story[data-id]"); if(!st) return;

    var h = s.querySelector("h2"), label = h ? h.textContent.trim() : (s.id==="try" ? "Try it" : "");
    if(!label) return;
    if(!s.id) s.id = "sec-" + slug(label);                        // ids on every section, so search can jump to them
    if(!s.offsetParent) return;                                   // hidden by Short/Full: not in the nav
    secs.push({el:s, label:label});
  });
  if(secs.length < 3) return;
  var nav = document.createElement("nav");
  nav.id = "toc"; nav.className = "toc"; nav.setAttribute("aria-label", "On this page");
  nav.innerHTML = "<ol>" + secs.map(function(s){ return "<li><a href='#"+s.el.id+"' data-sec='"+s.el.id+"'>"+esc(s.label)+"</a></li>"; }).join("") + "</ol>";
  app.appendChild(nav);
  nav.addEventListener("click", function(e){
    var a = e.target.closest("a[data-sec]"); if(!a) return;
    e.preventDefault();                                           // the hash is the router's: scroll instead
    var el = document.getElementById(a.getAttribute("data-sec")); if(!el) return;
    el.scrollIntoView({behavior: REDUCE ? "auto" : "smooth", block: "start"});
    var h = el.querySelector("h1,h2"); if(h){ h.setAttribute("tabindex", "-1"); h.focus({preventScroll:true}); }
  });
  var links = nav.querySelectorAll("a");
  function mark(){
    var y = window.innerHeight * 0.35, cur = secs[0];
    secs.forEach(function(s){ if(s.el.getBoundingClientRect().top < y) cur = s; });
    links.forEach(function(a){ var on = a.getAttribute("data-sec")===cur.el.id; a.classList.toggle("on", on); if(on) a.setAttribute("aria-current", "location"); else a.removeAttribute("aria-current"); });
    // show once the header has scrolled away, so it never sits on top of the title
    nav.classList.toggle("show", top ? top.getBoundingClientRect().bottom < 80 : true);
  }
  tocObs = { disconnect: function(){ window.removeEventListener("scroll", mark); } };
  window.addEventListener("scroll", mark, {passive:true});
  mark();
}

var kb = null, kbList = [], kbSel = 0, kbBack = null;
function kbIndex(){
  var out = [];
  ITEMS.forEach(function(it){

      go:function(){ if(STORIES[it.id]) location.hash = it.id; else if(it.href) window.open(it.href, "_blank", "noopener"); else location.hash = "home-"+it.id; }});
    if(s) (s.blocks||[]).concat(s.full||[]).forEach(function(b){

      out.push({t:b.k, d:name, k:"Section", text:b.k+" "+name+" "+body,

  [["Now", "#now", "What I'm doing this month"], ["How I work", "#now", "Four principles, each tied to a project"], ["About", "#about", "Who I am, where I've worked"], ["Contact", "#contact", "Email and links"], ["Index", "#index", "Every project as a list"],
   ["Accessibility", "#accessibility", "Accessibility statement"], ["Resume", RESUME, "PDF"], ["Art and installations", "https://surajbarthy.com", "surajbarthy.com"]
  ].forEach(function(p){
    out.push({t:p[0], d:p[2], k:"Page", text:p[0]+" "+p[2], go:function(){ if(/^#/.test(p[1])) location.hash = p[1].slice(1); else window.open(p[1], "_blank", "noopener"); }});
  });
  return out;
}
function kbFilter(q){
  var all = kbIndex(); q = q.trim().toLowerCase();
  if(!q) return all.filter(function(r){ return r.k!=="Section"; }).slice(0, 12);
  var words = q.split(/\s+/);
  return all.map(function(r){
    var t = r.t.toLowerCase(), x = r.text.toLowerCase();
    if(!words.every(function(w){ return x.indexOf(w) >= 0; })) return null;
    var sc = (t.indexOf(q)===0 ? 0 : t.indexOf(q) >= 0 ? 1 : 2) + (r.k==="Section" ? 0.5 : 0);
    return {r:r, sc:sc};
  }).filter(Boolean).sort(function(a, b){ return a.sc - b.sc; }).slice(0, 12).map(function(x){ return x.r; });
}
function kbOpen(){
  if(kb) return;
  kbBack = document.activeElement;
  kb = document.createElement("div");
  kb.className = "kbar";
  kb.innerHTML = "<div class='kb-veil'></div><div class='kb-box' role='dialog' aria-modal='true' aria-label='Search the site'>"+
    "<input id='kb-in' type='text' role='combobox' aria-expanded='true' aria-controls='kb-list' aria-autocomplete='list' autocomplete='off' spellcheck='false' placeholder='Search projects, sections, pages' aria-label='Search'>"+
    "<ul id='kb-list' role='listbox' aria-label='Results'></ul>"+
    "<p class='kb-hint' aria-hidden='true'><span>↑ ↓ to move</span><span>Enter to open</span><span>Esc to close</span></p></div>";
  document.body.appendChild(kb);
  var inp = kb.querySelector("#kb-in");
  kbRender("");
  inp.focus();
  inp.addEventListener("input", function(){ kbRender(inp.value); });
  inp.addEventListener("keydown", function(e){
    if(e.key==="ArrowDown"){ e.preventDefault(); kbMove(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); kbMove(-1); }
    else if(e.key==="Enter"){ e.preventDefault(); kbGo(kbSel); }
    else if(e.key==="Escape"){ e.preventDefault(); kbClose(true); }
    else if(e.key==="Tab"){ e.preventDefault(); }                 // the dialog holds focus
  });
  kb.querySelector(".kb-veil").addEventListener("click", function(){ kbClose(true); });
  kb.querySelector("#kb-list").addEventListener("click", function(e){ var li = e.target.closest("[data-i]"); if(li) kbGo(+li.getAttribute("data-i")); });
}
function kbRender(q){
  kbList = kbFilter(q); kbSel = 0;
  var ul = kb.querySelector("#kb-list");
  ul.innerHTML = kbList.length ? kbList.map(function(r, i){
    return "<li role='option' id='kb-o"+i+"' data-i='"+i+"'"+(i===0?" aria-selected='true'":" aria-selected='false'")+"><span class='kb-t'>"+esc(r.t)+"</span><span class='kb-d'>"+esc(r.k)+" · "+esc(r.d)+"</span></li>";
  }).join("") : "<li class='kb-none' role='option' aria-disabled='true'>Nothing matches. Try a company, a project or a word like onboarding.</li>";
  kb.querySelector("#kb-in").setAttribute("aria-activedescendant", kbList.length ? "kb-o0" : "");
}
function kbMove(d){
  if(!kbList.length) return;
  kbSel = (kbSel + d + kbList.length) % kbList.length;
  Array.prototype.forEach.call(kb.querySelectorAll("[data-i]"), function(li, i){ li.setAttribute("aria-selected", String(i===kbSel)); });
  var el = kb.querySelector("#kb-o"+kbSel); if(el) el.scrollIntoView({block:"nearest"});
  kb.querySelector("#kb-in").setAttribute("aria-activedescendant", "kb-o"+kbSel);
}
function kbGo(i){ var r = kbList[i]; if(!r) return; kbClose(false); r.go(); }
function kbClose(restore){
  if(!kb) return;
  kb.remove(); kb = null;
  if(restore && kbBack && kbBack.focus) kbBack.focus({preventScroll:true});
}
document.addEventListener("keydown", function(e){
  if((e.metaKey || e.ctrlKey) && (e.key==="k" || e.key==="K")){ e.preventDefault(); if(kb) kbClose(true); else kbOpen(); }
}, true);
document.addEventListener("click", function(e){ if(e.target.closest && e.target.closest(".kb-btn")){ e.preventDefault(); kbOpen(); } });

    sec("What I've done",
      "<ul>"+
