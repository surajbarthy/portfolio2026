<script type="module">
import * as THREE from "three";
import {FBXLoader} from "three/addons/loaders/FBXLoader.js";

import {GLTFExporter} from "three/addons/exporters/GLTFExporter.js";
window.conv = async () => {
  const f = await new FBXLoader().loadAsync("Running.fbx");

    const fps = 30, n = Math.max(2, Math.round(clip.duration * fps) + 1), times = [];

    const parentW = new THREE.Quaternion(), want = new THREE.Quaternion();
    for (let i = 0; i < n; i++) {
      const t = Math.min(clip.duration, i / fps); times.push(t);
      mx.setTime(t); src.updateMatrixWorld(true);
      tb.forEach(b => b.t.quaternion.copy(b.tLocal0));
      tgt.updateMatrixWorld(true);

        b.s.getWorldQuaternion(q);

};
window.ready = true;
</script>
